name: n138-kz.github.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload_secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export to json
        run: echo '${{ toJSON(secrets) }}' | jq -c | tee secrets.json
      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: payload-secrets
          path: payload.json
